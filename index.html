<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscrição para Treinamentos | TOTVS</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body {
      background-color: #eef2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0, 34, 51, 0.12);
      width: 100%;
      max-width: 460px;
      overflow: hidden; /* Faz o cabeçalho azul respeitar as bordas arredondadas */
    }
    /* Cabeçalho com o Azul Profundo da TOTVS */
    .card-header {
      background-color: #002233;
      padding: 0;
      line-height: 0;
    }
    .card-header img {
      width: 100%;
      height: auto;
      display: block;
    }
    /* Corpo do formulário */
    .card-body {
      padding: 32px 36px 36px;
    }
    h2 { margin-top: 0; color: #002233; font-size: 22px; font-weight: 700; }
    p { color: #52606d; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; color: #1f2933; font-size: 14px; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd2d9;
      border-radius: 8px;
      font-size: 15px;
      transition: all 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #002233;
      box-shadow: 0 0 0 3px rgba(0, 34, 51, 0.12);
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: #002233;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      margin-top: 8px;
    }
    button:hover { background-color: #043852; }
    button:active { transform: scale(0.99); }
    button:disabled { background-color: #7b8794; cursor: not-allowed; }
    #mensagem {
      margin-top: 18px;
      padding: 14px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      display: none;
      font-weight: 500;
    }
    .sucesso { background-color: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .erro { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
  </style>
</head>
<body>

  <div class="card">
    <!-- Faixa superior com a cor e logo da TOTVS -->
    <div class="card-header">
      <img src="logo-totvs.png" alt="Logo TOTVS">
    </div>

    <div class="card-body">
      <h2>Inscrição para Treinamentos</h2>
      <p>Preencha os dados abaixo para confirmar sua participação em nossas sessões de capacitação.</p>

      <form id="formInscricao" onsubmit="enviarParaGoogleForms(event)">
        <div class="form-group">
          <label for="nome">Nome completo *</label>
          <input type="text" id="nome" placeholder="Ex: João Silva" required>
        </div>

        <div class="form-group">
          <label for="email">E-mail corporativo *</label>
          <input type="email" id="email" placeholder="joao@empresa.com.br" required>
        </div>

        <div class="form-group">
          <label for="empresa">Empresa *</label>
          <input type="text" id="empresa" placeholder="Nome da sua empresa" required>
        </div>

        <div class="form-group">
          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone" placeholder="(11) 99999-9999" required>
        </div>

        <button type="submit" id="btnEnviar">Confirmar Inscrição</button>
      </form>

      <div id="mensagem"></div>
    </div>
  </div>

  <script>
    const URL_ENVIO_FORMS  = "https://docs.google.com/forms/d/e/1FAIpQLSdmmVlYDORcFLbA2e1jt_h5Lvsezq4oR1pP_pWj3nwZgcdX7g/formResponse";
    const ID_CAMPO_NOME    = "entry.2021482454";
    const ID_CAMPO_EMAIL   = "entry.1810517846";
    const ID_CAMPO_EMPRESA = "entry.1150958815";
    const ID_CAMPO_TELEFONE = "entry.1858237478";

    function enviarParaGoogleForms(event) {
      event.preventDefault();

      const btn = document.getElementById('btnEnviar');
      const msg = document.getElementById('mensagem');

      btn.disabled = true;
      btn.innerText = 'Enviando inscrição...';
      msg.style.display = 'none';

      const dadosFormulario = new FormData();
      dadosFormulario.append(ID_CAMPO_NOME, document.getElementById('nome').value.trim());
      dadosFormulario.append(ID_CAMPO_EMAIL, document.getElementById('email').value.trim());
      dadosFormulario.append(ID_CAMPO_EMPRESA, document.getElementById('empresa').value.trim());
      dadosFormulario.append(ID_CAMPO_EMPRESA, document.getElementById('telefone').value.trim());

      fetch(URL_ENVIO_FORMS, {
        method: 'POST',
        mode: 'no-cors',
        body: dadosFormulario
      })
      .then(() => {
        msg.className = 'sucesso';
        msg.innerText = 'Inscrição confirmada com sucesso! Nos vemos no treinamento.';
        msg.style.display = 'block';
        document.getElementById('formInscricao').reset();
      })
      .catch((erro) => {
        msg.className = 'erro';
        msg.innerText = 'Ocorreu um erro de conexão. Verifique sua internet e tente novamente.';
        msg.style.display = 'block';
        console.error('Erro:', erro);
      })
      .finally(() => {
        btn.disabled = false;
        btn.innerText = 'Confirmar Inscrição';
      });
    }
  </script>

</body>
</html>
